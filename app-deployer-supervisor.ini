; ===========================
; Laravel — Reverb / Horizon / Octane / Inertia SSR (production)
; App Deployer — AlmaLinux + Supervisor (Plesk)
; ===========================
;
; À copier sur le serveur dans le répertoire de config de Supervisor
; (ex: /etc/supervisord.d/app-deployer-supervisor.ini), puis :
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status app_deployer_stack:*
;
; Octane tourne ici en interne sur 127.0.0.1:8000, PAS branché au trafic
; public : le HTTP reste servi normalement via Apache/Plesk (nginx proxy)
; tant que le vhost n'est pas explicitement reconfiguré pour pointer
; vers Octane à la place.

[program:reverb]
directory=/var/www/vhosts/app-deployer.dev/httpdocs/
command=/bin/bash -lc 'PHP_BIN=${PHP_BIN:-/usr/bin/php}; $PHP_BIN artisan reverb:start --host=127.0.0.1 --port=8081 --no-interaction'
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/vhosts/app-deployer.dev/httpdocs/storage/logs/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/root",APP_ENV="production",PATH="/usr/local/bin:/usr/bin",PHP_BIN="/usr/bin/php"
umask=022

[program:horizon]
directory=/var/www/vhosts/app-deployer.dev/httpdocs/
command=/bin/bash -lc 'PHP_BIN=${PHP_BIN:-/usr/bin/php}; $PHP_BIN artisan horizon'
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/vhosts/app-deployer.dev/httpdocs/storage/logs/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/root",APP_ENV="production",PATH="/usr/local/bin:/usr/bin",PHP_BIN="/usr/bin/php"
umask=022

[program:octane]
directory=/var/www/vhosts/app-deployer.dev/httpdocs/
command=/bin/bash -lc 'PHP_BIN=${PHP_BIN:-/usr/bin/php}; $PHP_BIN artisan octane:start --server=roadrunner --host=127.0.0.1 --port=8001 --no-interaction'
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/vhosts/app-deployer.dev/httpdocs/storage/logs/octane.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/root",APP_ENV="production",PATH="/usr/local/bin:/usr/bin",PHP_BIN="/usr/bin/php"
umask=022

[program:inertia-ssr]
; Rendu côté serveur (Node, via bootstrap/ssr/ssr.js — voir `npm run build`)
; des pages publiques/SEO (Welcome, pages légales, Login/Register). La commande
; `inertia:start-ssr` n'a pas d'option --host/--port : le port d'écoute réel
; est lu par resources/js/ssr.tsx depuis la variable d'env INERTIA_SSR_PORT
; ci-dessous (défaut 13714 si absente). Le .env de production doit avoir
; INERTIA_SSR_ENABLED=true et INERTIA_SSR_URL pointant vers ce même port (ex:
; http://127.0.0.1:13714) — INERTIA_SSR_URL est utilisé côté PHP pour savoir
; où envoyer les requêtes de rendu, INERTIA_SSR_PORT côté Node pour savoir sur
; quel port écouter ; changez les deux ensemble si vous changez de port.
; Si ce process est down, Inertia bascule silencieusement en rendu client
; (voir CLAUDE.md, section "Inertia SSR (SEO)").
directory=/var/www/vhosts/app-deployer.dev/httpdocs/
command=/bin/bash -lc 'PHP_BIN=${PHP_BIN:-/usr/bin/php}; $PHP_BIN artisan inertia:start-ssr --no-interaction'
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/vhosts/app-deployer.dev/httpdocs/storage/logs/inertia-ssr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/root",APP_ENV="production",PATH="/usr/local/bin:/usr/bin",PHP_BIN="/usr/bin/php"
umask=022

[group:app_deployer]
programs=reverb,horizon,octane,inertia-ssr
priority=999
